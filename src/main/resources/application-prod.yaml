server:
  port: 5000

logging:
  level:
    root: INFO
    com.tenco.spring_blog: INFO

spring:
  # 데이터 베이스 연결 (H2 메모리 DB 사용)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA 설정
  jpa:
    hibernate:
      default_batch_fetch_size: 10
      # 운영에서는 create를 쓰지 않음 없는 테이블과 컬럼만 추가함
      ddl-auto: update
    # 실행되는 SQL을 콘솔에 출력한다.
    show-sql: true
    # 추후 data.sql을 테이블 생성 후에 실행한다.
    defer-datasource-initialization: true
